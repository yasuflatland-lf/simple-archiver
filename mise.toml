[tools]
# Install rustfmt and clippy alongside rust so CI (mise-action) has them.
# Without explicit components, rustup uses the minimal profile and `cargo fmt`/`clippy` are absent.
# llvm-tools-preview is required by cargo-llvm-cov for source-based coverage.
rust = { version = "1.97.1", components = "rustfmt,clippy,llvm-tools-preview" }
node = "24.18.0"
pnpm = "11.16.0"
# `cargo.binstall = true` below is a no-op unless cargo-binstall is on PATH: mise's cargo backend
# probes for the binary and silently falls back to a from-source `cargo install` when it is absent.
# Declaring it here makes mise install it first (from a prebuilt aqua release, ~2 s) and then use it
# to fetch the `cargo:` tools below as prebuilt binaries instead of compiling them.
cargo-binstall = "1.21.1"
"cargo:cargo-nextest" = "0.9.137"
"cargo:cargo-llvm-cov" = "0.8.7"
# cargo-machete lives in mise.ci-hygiene.toml because only the `hygiene` CI job uses it
# (MISE_ENV=ci-hygiene). cargo-modules is not managed by mise: the job installs it with
# `cargo install` and caches it keyed on its own version because it publishes no prebuilt binary,
# while mise-action's cache key hashes every mise*.toml.

[settings]
# Fetch `cargo:` tools as prebuilt binaries via cargo-binstall (declared in [tools] above).
cargo.binstall = true
