name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI-only debuginfo trimming. `line-tables-only` keeps file:line in panic and test-failure
# backtraces (all CI needs) and drops variable/type DWARF, which nothing in CI reads. This cuts
# codegen + link time on the `app` jobs and shrinks `target/debug`, which in turn shrinks the
# Swatinem/rust-cache entries — the repo is currently 12.49 GB against GitHub's 10 GB cache
# limit, so entries are being evicted and every eviction costs a full cold rebuild.
# Set as workflow env rather than `[profile.dev]` in Cargo.toml so local development keeps
# full debug info for step-debugging.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  core:
    name: core (rust, pure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Only the tools this job runs: rustfmt/clippy come from the `rust` entry's components,
      # and this is the sole job that uses cargo-llvm-cov.
      # `install_args` restricts `mise install` to exactly the tools named, and mise does NOT pull in a
      # declared-but-unnamed tool as a dependency: with cargo-binstall omitted the cargo backend finds no
      # binstall on PATH and silently falls back to `cargo install <tool> --locked`, a from-source build.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          install_args: rust cargo-binstall cargo:cargo-llvm-cov cargo:cargo-nextest
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Belt and suspenders: mise.toml requests rustfmt/clippy/llvm-tools-preview
      # components, but ensure they exist on the active toolchain even if a cached
      # install lacks them. llvm-tools-preview is required by cargo-llvm-cov.
      - run: rustup component add rustfmt clippy llvm-tools-preview
      - run: cargo fmt --check
      - run: cargo clippy -p simple-archiver-core --all-targets -- -D warnings
      - run: cargo llvm-cov nextest -p simple-archiver-core --profile ci --lcov --output-path lcov.info --ignore-filename-regex 'build\.rs'
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: rust
          fail_ci_if_error: false

  loom:
    name: loom (concurrency model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No coverage is collected here, so cargo-llvm-cov is not installed.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          # cargo-binstall must be named or the `cargo:` tools below fall back to a source build.
          install_args: rust cargo-binstall cargo:cargo-nextest
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Belt and suspenders: ensure clippy is available even if a cached install lacks it.
      - run: rustup component add clippy
      # Keep the loom-gated build warning-clean (normal clippy never sees #[cfg(loom)] code).
      - run: RUSTFLAGS="--cfg loom" cargo clippy -p simple-archiver-core --features loom -- -D warnings
      # Run the loom nucleus: verifies single-writer aggregation (no message lost, correct
      # summary partition) under every loom interleaving. loom 0.7 models message count, not
      # sender-drop/channel closure, so the production worker→channel-close→drain ordering is
      # covered by the regular tokio tests, not loom. Does NOT verify the tokio runtime or
      # CancellationToken propagation (those are covered by the regular tokio cancel-path tests).
      - run: RUSTFLAGS="--cfg loom" cargo nextest run -p simple-archiver-core --features loom

  hygiene:
    name: hygiene (deps + orphan files)
    runs-on: ubuntu-latest
    # Load mise.ci-hygiene.toml so mise-action installs cargo-machete here only.
    env:
      MISE_ENV: ci-hygiene
      # Single source of truth for the pin; also the cache key below. Tracked by the Renovate
      # custom manager in renovate.json.
      CARGO_MODULES_VERSION: "0.26.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          # `rust` is required because cargo-machete is a cargo subcommand invoked as `cargo machete`.
          # cargo-binstall must be named or the `cargo:` tools below fall back to a source build.
          install_args: rust cargo-binstall cargo:cargo-machete
      # cargo-modules ships no prebuilt binary, so it is a ~9 min source build. Cache it keyed on
      # its own version alone: mise-action's cache key hashes every `mise*.toml`, so leaving it
      # under mise meant any `rust`/`node`/`pnpm`/`cargo-nextest` bump rebuilt it from scratch.
      # `--root` pins the install location so the cache path does not depend on CARGO_HOME.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-modules-cache
        with:
          path: ~/.cargo-tools
          key: cargo-modules-${{ runner.os }}-${{ env.CARGO_MODULES_VERSION }}
      - if: steps.cargo-modules-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-modules@${{ env.CARGO_MODULES_VERSION }} --locked --root ~/.cargo-tools
      - run: echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"
      # Unused Cargo.toml dependencies across the whole workspace (no compilation needed).
      # Intentional declarations (transitive version pins, PR5 pre-declarations) are
      # allow-listed via `[package.metadata.cargo-machete]` in each crate's Cargo.toml.
      - run: cargo machete
      # Orphan source files: `.rs` files not wired into the module tree (`--deny` fails on any).
      # Scoped to the pure core crate; src-tauri would need the GTK/webkit build env on Linux.
      # (Module-cycle detection via `cargo modules dependencies --acyclic` is intentionally not
      # run: it flags every type<->method pair as a cycle and cannot be filtered. See PR notes.)
      - run: cargo modules orphans -p simple-archiver-core --lib --deny

  frontend:
    name: frontend (oxlint + oxfmt + vitest + build + knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # This job is pure JavaScript; without install_args it installs the Rust toolchain and
      # builds cargo-nextest + cargo-llvm-cov from source (4m21s on a cold cache) for nothing.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      # Frontend format check (config in .oxfmtrc.json); fails if any file is unformatted.
      - run: pnpm fmt:check
      # Frontend lint gate (config in .oxlintrc.json); fails on warnings or errors.
      - run: pnpm lint:ci
      # Frontend dependency hygiene: unused files / deps / exports (config in knip.json).
      - run: pnpm knip
      - run: pnpm run test:coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
      - run: pnpm build

  app:
    name: app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Runs nextest and the pnpm/tauri build; coverage is collected by the `core` job only.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          # cargo-binstall must be named or the `cargo:` tools below fall back to a source build.
          install_args: rust node pnpm cargo-binstall cargo:cargo-nextest
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Belt and suspenders: mise.toml requests clippy components, but
      # ensure they exist on the active toolchain even if a cached install lacks them.
      - run: rustup component add clippy
      # PR6: the presentation crate's tests (Tauri command surface, progress
      # event sink, run_job integration) only build on runners with the Tauri
      # toolchain, which the app job has. Run them here so they are covered in CI.
      - if: matrix.os == 'macos-latest'
        run: cargo clippy -p simple-archiver --all-targets -- -D warnings
      # Windows additionally runs the core suite: the `core` job already covers it on Linux, and
      # macOS shares Linux's `/` path separator, so Windows is the sole job that catches `\` vs
      # `/` regressions. Both crates go through ONE nextest invocation so cargo resolves the
      # workspace and walks the fingerprint tree once instead of twice — on the Windows runner
      # that scan is the bulk of the second invocation's non-compile time.
      - if: matrix.os == 'windows-latest'
        run: cargo nextest run -p simple-archiver-core -p simple-archiver --profile ci
      - if: matrix.os == 'macos-latest'
        run: cargo nextest run -p simple-archiver --profile ci
      # node_modules is installed for `pnpm tauri build` below (beforeBuildCommand: pnpm build),
      # not for tests: the vitest suite is jsdom-only with no OS-dependent behaviour, so it runs
      # once in the `frontend` job rather than a third time here on each OS.
      - run: pnpm install --frozen-lockfile
      # Smoke-build the app in the dev profile (--debug): this reuses the already
      # compiled `target/debug` dependency tree from the nextest steps above, so
      # the full dependency tree is no longer recompiled a second time under the
      # release profile. `--no-bundle` keeps it a compile/link check, not an
      # artifact build (release.yml builds the optimized, bundled binaries).
      # tauri build runs `beforeBuildCommand: pnpm build`, so the frontend is
      # built here too — a separate `pnpm build` step would be redundant.
      - run: pnpm tauri build --no-bundle --debug
